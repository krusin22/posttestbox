<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery Box | Luxury Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a12;
            --card-bg: #14142b;
            --primary: #d4af37; /* สีทอง */
            --primary-hover: #e6c250;
            --text: #e0e0e0;
            --text-muted: #999;
            --success: #00e676;
            --danger: #ff5252;
            --box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --luxury-gradient: linear-gradient(135deg, #14142b 0%, #0a0a12 100%);
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
            opacity: 0;
            animation: fadeInDown 0.6s ease forwards;
        }

        h1 {
            color: var(--primary);
            font-weight: 700;
            font-size: clamp(26px, 6vw, 36px);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            color: var(--text-muted);
            font-weight: 300;
            font-size: clamp(14px, 3vw, 16px);
            letter-spacing: 1px;
        }

        /* Main Container */
        .main-container {
            max-width: 900px;
            width: 100%;
            opacity: 0;
            animation: zoomIn 0.6s ease 0.2s forwards;
        }

        /* Grid */
        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            perspective: 1000px;
        }

        @media (min-width: 600px) {
            .grid-boxes {
                grid-template-columns: repeat(5, 1fr);
                gap: 18px;
            }
        }

        /* กล่อง */
        .box {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            aspect-ratio: 1;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--box-shadow);
            position: relative;
            transform-style: preserve-3d;
            user-select: none;
        }

        .box::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, var(--primary), transparent, var(--primary));
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
            filter: blur(5px);
        }

        @media (hover: hover) {
            .box:hover:not(:disabled) {
                transform: translateY(-5px) rotateY(5deg);
                border-color: var(--primary);
            }
            .box:hover:not(:disabled)::before {
                opacity: 0.6;
            }
        }

        .box:active:not(:disabled) {
            transform: scale(0.92);
        }

        .box:disabled {
            cursor: default;
        }

        .box-number {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 700;
            color: var(--text);
            transition: all 0.3s ease;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .box-icon {
            font-size: clamp(24px, 5vw, 32px);
            opacity: 0;
            transform: scale(0) rotate(-180deg);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
        }

        .box.opened {
            background: #10101f;
            border-color: #333;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .box.opened .box-number {
            opacity: 0;
            transform: scale(0);
        }

        .box.opened .box-icon {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* แผงสถานะ */
        .status-panel {
            background: var(--card-bg);
            padding: 18px 20px;
            border-radius: 16px;
            margin-top: 25px;
            font-size: clamp(14px, 3.5vw, 16px);
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .status-text {
            color: var(--text-muted);
            flex: 1;
        }

        .status-highlight {
            color: var(--primary);
            font-weight: 600;
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #444;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .btn-reset:hover {
            background: var(--primary);
            color: var(--bg-color);
            border-color: var(--primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--luxury-gradient);
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--primary);
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
            z-index: -1;
        }

        .modal-overlay.open .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
        }

        .modal-title {
            font-size: clamp(22px, 5vw, 26px);
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-desc {
            font-size: clamp(16px, 4vw, 18px);
            color: var(--text);
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 300;
        }

        .modal-desc b {
            color: var(--primary);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .modal-btn {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            border: none;
            flex: 1;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        .btn-ok {
            background: var(--primary);
            color: var(--bg-color);
        }
        
        .btn-action-yes {
            background: var(--success);
            color: #000;
        }

        .btn-action-no {
            background: var(--danger);
            color: white;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Mystery Box</h1>
        <div class="subtitle">LUXURY EDITION</div>
    </header>

    <div class="main-container">
        <div class="grid-boxes" id="boxGrid">
            <!-- สร้างกล่องผ่าน JavaScript -->
        </div>

        <div class="status-panel">
            <span class="status-text" id="statusText">สถานะ: <span class="status-highlight">พร้อมเสี่ยงโชค!</span></span>
            <button class="btn-reset" onclick="initGame()">เริ่มใหม่</button>
        </div>
    </div>

    <!-- Modal ป๊อปอัพ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span id="modalIcon" class="modal-icon"></span>
            <h2 class="modal-title" id="modalTitle"></h2>
            <p class="modal-desc" id="modalDesc"></p>
            <div id="modalActionButtons" class="btn-group">
                <!-- ปุ่มจะถูกสร้างตรงนี้ -->
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลสุ่มท่าทาง
        const actionsList = [
            "ยิ้มหวานให้กล้อง 10 วินาที 😁",
            "ทำท่าแมวเหมียวอ้อนๆ 🐱",
            "เต้นท่าไก่ย่าง 15 วินาที 🐔",
            "ทำหน้าทะเล้นสุดฤทธิ์ 😜",
            "หัวเราะแบบร้ายกาจ 3 ที 😈",
            "ทำท่าซูเปอร์ฮีโร่กู้โลก 🦸‍♂️",
            "กระโดดตบ 5 ครั้ง 🤸‍♂️",
            "ส่งจูบให้หน้าจอ 2 ครั้ง 😘"
        ];

        // รายละเอียดของผลลัพธ์แต่ละแบบ
        const outcomeDetails = {
            'continue': { text: "เล่นต่อ", icon: "🎉", titleColor: "var(--success)" },
            'rest1': { text: "พัก 1 ตา", icon: "☕️", titleColor: "var(--danger)" },
            'rest2': { text: "พัก 2 ตา", icon: "⏳", titleColor: "var(--danger)" },
            'rest3': { text: "พัก 3 ตา", icon: "💤", titleColor: "var(--danger)" },
            'rest5': { text: "พัก 5 ตา", icon: "🛑", titleColor: "var(--danger)" },
            'action': { text: "สุ่มท่าทาง", icon: "🎭", titleColor: "var(--primary)" }
        };

        // สัดส่วนของรางวัลใน 20 กล่อง
        const boxDistribution = [
            'continue', 'continue', 'continue', 'continue', 'continue', 'continue', 'continue', 'continue', 'continue', // 9 เล่นต่อ
            'rest1', 'rest1', 'rest1', // 3 พัก 1 ตา
            'rest2', 'rest2', // 2 พัก 2 ตา
            'rest3', // 1 พัก 3 ตา
            'rest5', // 1 พัก 5 ตา
            'action', 'action', 'action', 'action' // 4 สุ่มท่าทาง
        ];

        let gameBoxes = [];
        let openedCount = 0;

        const gridEl = document.getElementById('boxGrid');
        const statusText = document.getElementById('statusText');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalActionButtons = document.getElementById('modalActionButtons');

        // ฟังก์ชันสลับ Array
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // เริ่มเกม
        function initGame() {
            gridEl.innerHTML = '';
            openedCount = 0;
            statusText.innerHTML = "สถานะ: <span class='status-highlight'>พร้อมเสี่ยงโชค!</span>";
            
            // สับไพ่ผลลัพธ์
            gameBoxes = shuffle([...boxDistribution]);

            for (let i = 0; i < 20; i++) {
                const box = document.createElement('button');
                box.className = 'box';
                
                const numberSpan = document.createElement('span');
                numberSpan.className = 'box-number';
                numberSpan.innerText = i + 1;
                
                const iconSpan = document.createElement('span');
                iconSpan.className = 'box-icon';
                
                box.appendChild(numberSpan);
                box.appendChild(iconSpan);

                box.onclick = () => openBox(i, box, iconSpan);
                gridEl.appendChild(box);
            }
            closeModal();
        }

        // เปิดกล่อง
        function openBox(index, boxEl, iconEl) {
            if (boxEl.disabled) return;
            
            boxEl.disabled = true;
            boxEl.classList.add('opened');
            openedCount++;

            const resultType = gameBoxes[index];
            const details = outcomeDetails[resultType];
            
            iconEl.innerText = details.icon;
            
            // หน่วงเวลาเล็กน้อยให้แอนิเมชั่นกล่องพลิกทำงานก่อนแสดงป๊อปอัพ
            setTimeout(() => {
                showModal(resultType, details);
            }, 450); 
        }

        // แสดงป๊อปอัพ
        function showModal(resultType, details) {
            modalIcon.innerText = details.icon;
            modalTitle.style.color = details.titleColor;
            modalActionButtons.innerHTML = '';
            
            if (resultType === 'continue') {
                modalTitle.innerText = "โชคดีมาก!";
                modalDesc.innerHTML = `คุณได้สิทธิ์ <b style="color: var(--success)">'เล่นต่อ'</b> ตาถัดไปได้เลย`;
                
                const btn = document.createElement('button');
                btn.className = 'modal-btn btn-ok';
                btn.innerText = 'ตกลง (เล่นต่อ)';
                btn.onclick = () => updateStatus(details.text);
                modalActionButtons.appendChild(btn);

            } else if (resultType.startsWith('rest')) {
                modalTitle.innerText = "หยุดก่อน!";
                modalDesc.innerHTML = `น่าเสียดาย คุณโดนสั่ง <b style="color: var(--danger)">'${details.text}'</b>`;
                
                const btn = document.createElement('button');
                btn.className = 'modal-btn btn-ok';
                btn.innerText = 'ยอมรับชะตากรรม';
                btn.onclick = () => updateStatus(details.text);
                modalActionButtons.appendChild(btn);

            } else if (resultType === 'action') {
                modalTitle.innerText = "ภารกิจพิเศษ!";
                const randomAction = actionsList[Math.floor(Math.random() * actionsList.length)];
                modalDesc.innerHTML = `ท่าที่คุณต้องทำคือ:<br><br><span style="font-size: 22px; color: var(--primary);"><b>"${randomAction}"</b></span><br><br>ทำสำเร็จหรือไม่?`;

                const btnYes = document.createElement('button');
                btnYes.className = 'modal-btn btn-action-yes';
                btnYes.innerText = 'ทำได้ (เล่นต่อ)';
                btnYes.onclick = () => updateStatus('ทำท่าสำเร็จ! ได้เล่นต่อ');

                const btnNo = document.createElement('button');
                btnNo.className = 'modal-btn btn-action-no';
                btnNo.innerText = 'ทำไม่ได้ (อดเล่น)';
                btnNo.onclick = () => updateStatus('ทำท่าไม่สำเร็จ! อดเล่น');

                modalActionButtons.appendChild(btnYes);
                modalActionButtons.appendChild(btnNo);
            }

            modalOverlay.classList.add('open');
        }

        // อัปเดตข้อความสถานะด้านล่าง
        function updateStatus(text) {
            closeModal();
            statusText.innerHTML = `ล่าสุด: <span class='status-highlight'>${text}</span> (เปิดแล้ว ${openedCount}/20)`;
            
            if (openedCount >= 20) {
                setTimeout(() => {
                    statusText.innerHTML = `<span style='color: var(--success)'>🎉 เปิดครบทุกกล่องแล้ว!</span>`;
                }, 500);
            }
        }

        // ปิดป๊อปอัพ
        function closeModal() {
            modalOverlay.classList.remove('open');
        }

        // เริ่มเกมตอนโหลดหน้าเว็บ
        initGame();
    </script>
</body>
</html>
