<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- ตั้งค่า Viewport ให้รองรับมือถือและป้องกันการซูมโดยไม่ตั้งใจ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mystery Box | All Devices Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a12;
            --card-bg: rgba(20, 20, 43, 0.85);
            --primary: #d4af37; /* สีทองหรูหรา */
            --primary-hover: #e6c250;
            --text: #e0e0e0;
            --text-muted: #999;
            --success: #00e676;
            --danger: #ff5252;
            --box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
            --luxury-gradient: linear-gradient(135deg, #14142b 0%, #0a0a12 100%);
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            /* ใช้ 100dvh แก้ปัญหาแถบ URL บนมือถือ และ env() สำหรับรอยบาก iPhone */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* เว้นระยะขอบปลอดภัยสำหรับ iPhone / iPad */
            padding: calc(20px + env(safe-area-inset-top)) 
                     calc(15px + env(safe-area-inset-right)) 
                     calc(20px + env(safe-area-inset-bottom)) 
                     calc(15px + env(safe-area-inset-left));
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1a1a3a 0%, #0a0a12 70%);
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            opacity: 0;
            animation: fadeInDown 0.6s ease forwards;
        }

        h1 {
            color: var(--primary);
            font-weight: 700;
            font-size: clamp(24px, 6vw, 36px);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 2px 15px rgba(212, 175, 55, 0.4);
        }

        .subtitle {
            color: var(--text-muted);
            font-weight: 300;
            font-size: clamp(13px, 3.5vw, 16px);
            letter-spacing: 1px;
        }

        /* Main Container */
        .main-container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
            opacity: 0;
            animation: zoomIn 0.6s ease 0.2s forwards;
        }

        /* Grid */
        .grid-boxes {
            display: grid;
            /* มือถือจอเล็ก: 4 คอลัมน์ */
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            perspective: 1000px;
        }

        /* แท็บเล็ต iPad และ PC: 5 คอลัมน์ */
        @media (min-width: 600px) {
            .grid-boxes {
                grid-template-columns: repeat(5, 1fr);
                gap: 15px;
            }
        }

        /* กล่อง */
        .box {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            aspect-ratio: 1;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            transform-style: preserve-3d;
            user-select: none;
            backdrop-filter: blur(5px);
        }

        /* Hover Effect (เฉพาะบน PC) */
        @media (hover: hover) and (pointer: fine) {
            .box:hover:not(:disabled) {
                transform: translateY(-5px);
                border-color: var(--primary);
                box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
            }
        }

        /* Active Effect (เมื่อเอานิ้วกดบนมือถือ) */
        .box:active:not(:disabled) {
            transform: scale(0.92);
            background: rgba(212, 175, 55, 0.1);
        }

        .box:disabled {
            cursor: default;
        }

        .box-number {
            font-size: clamp(18px, 5vw, 28px);
            font-weight: 700;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .box-icon {
            font-size: clamp(24px, 6vw, 36px);
            opacity: 0;
            transform: scale(0) rotate(-180deg);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
        }

        .box.opened {
            background: #11111a;
            border-color: #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .box.opened .box-number {
            opacity: 0;
            transform: scale(0);
        }

        .box.opened .box-icon {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* แผงสถานะ */
        .status-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: clamp(13px, 3.5vw, 16px);
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap; /* ให้ปุ่มปัดลงมาบรรทัดใหม่ได้ถ้าจอมือถือเล็กมาก */
        }

        .status-text {
            color: var(--text-muted);
            flex: 1;
            min-width: 60%;
        }

        .status-highlight {
            color: var(--primary);
            font-weight: 600;
        }

        .btn-reset {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #555;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: 600;
        }

        .btn-reset:active {
            transform: scale(0.95);
        }

        .btn-reset:hover {
            background: var(--primary);
            color: var(--bg-color);
            border-color: var(--primary);
        }

        /* Modal (ป๊อปอัพ) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--luxury-gradient);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            max-height: 90vh; /* ป้องกันป๊อปอัพทะลุจอถ้าตะแคงมือถือเล่น */
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid var(--primary);
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.open .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            font-size: 50px;
            margin-bottom: 10px;
            display: block;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
        }

        .modal-title {
            font-size: clamp(20px, 5.5vw, 26px);
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .modal-desc {
            font-size: clamp(15px, 4vw, 17px);
            color: var(--text);
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 300;
        }

        .modal-desc b {
            color: var(--primary);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            /* มือถือจอเล็กมาก (เช่น iPhone SE) ให้ปุ่มเรียงแนวตั้ง */
            flex-direction: column; 
        }

        /* มือถือทั่วไป แท็บเล็ต PC ให้ปุ่มเรียงแนวนอน */
        @media (min-width: 360px) {
            .btn-group {
                flex-direction: row;
            }
        }

        .modal-btn {
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            border: none;
            flex: 1;
            transition: all 0.2s ease;
            min-height: 48px; /* Touch target มาตรฐาน iOS/Android */
        }

        .modal-btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .btn-ok { background: var(--primary); color: var(--bg-color); }
        .btn-action-yes { background: var(--success); color: #000; }
        .btn-action-no { background: var(--danger); color: white; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Mystery Box</h1>
        <div class="subtitle">PREMIUM EDITION • ALL DEVICES</div>
    </header>

    <div class="main-container">
        <!-- พื้นที่กล่องสุ่ม -->
        <div class="grid-boxes" id="boxGrid"></div>

        <!-- แผงบอกสถานะ -->
        <div class="status-panel">
            <span class="status-text" id="statusText">สถานะ: <span class="status-highlight">พร้อมเสี่ยงโชค!</span></span>
            <button class="btn-reset" onclick="initGame()">เริ่มเกมใหม่</button>
        </div>
    </div>

    <!-- Modal (ป๊อปอัพ) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span id="modalIcon" class="modal-icon"></span>
            <h2 class="modal-title" id="modalTitle"></h2>
            <p class="modal-desc" id="modalDesc"></p>
            <div id="modalActionButtons" class="btn-group">
                <!-- ปุ่มจะถูกสร้างผ่าน JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // รายการสุ่มท่าทาง
        const actionsList = [
            "ยิ้มหวานให้กล้อง 10 วินาที 😁",
            "ทำท่าแมวเหมียวอ้อนๆ 🐱",
            "เต้นท่าไก่ย่าง 15 วินาที 🐔",
            "ทำหน้าทะเล้นสุดฤทธิ์ 😜",
            "หัวเราะแบบร้ายกาจ 3 ที 😈",
            "ทำท่าซูเปอร์ฮีโร่กู้โลก 🦸‍♂️",
            "กระโดดตบ 5 ครั้ง 🤸‍♂️",
            "ส่งจูบให้หน้าจอ 2 ครั้ง 😘"
        ];

        // รายละเอียดรางวัล
        const outcomeDetails = {
            'continue': { text: "เล่นต่อ", icon: "🎉", titleColor: "var(--success)" },
            'rest1': { text: "พัก 1 ตา", icon: "☕️", titleColor: "var(--danger)" },
            'rest2': { text: "พัก 2 ตา", icon: "⏳", titleColor: "var(--danger)" },
            'rest3': { text: "พัก 3 ตา", icon: "💤", titleColor: "var(--danger)" },
            'rest5': { text: "พัก 5 ตา", icon: "🛑", titleColor: "var(--danger)" },
            'action': { text: "สุ่มท่าทาง", icon: "🎭", titleColor: "var(--primary)" }
        };

        // สัดส่วนของรางวัลใน 20 กล่อง
        const boxDistribution = [
            'continue', 'continue', 'continue', 'continue', 'continue', 'continue', 'continue', 'continue', 'continue',
            'rest1', 'rest1', 'rest1',
            'rest2', 'rest2',
            'rest3',
            'rest5',
            'action', 'action', 'action', 'action'
        ];

        let gameBoxes = [];
        let openedCount = 0;

        const gridEl = document.getElementById('boxGrid');
        const statusText = document.getElementById('statusText');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalActionButtons = document.getElementById('modalActionButtons');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initGame() {
            gridEl.innerHTML = '';
            openedCount = 0;
            statusText.innerHTML = "สถานะ: <span class='status-highlight'>พร้อมเสี่ยงโชค!</span>";
            gameBoxes = shuffle([...boxDistribution]);

            for (let i = 0; i < 20; i++) {
                const box = document.createElement('button');
                box.className = 'box';
                
                const numberSpan = document.createElement('span');
                numberSpan.className = 'box-number';
                numberSpan.innerText = i + 1;
                
                const iconSpan = document.createElement('span');
                iconSpan.className = 'box-icon';
                
                box.appendChild(numberSpan);
                box.appendChild(iconSpan);

                // รองรับทั้งคลิกบน PC และแตะบนมือถือ
                box.onclick = (e) => {
                    e.preventDefault();
                    openBox(i, box, iconSpan);
                };
                gridEl.appendChild(box);
            }
            closeModal();
        }

        function openBox(index, boxEl, iconEl) {
            if (boxEl.disabled) return;
            
            boxEl.disabled = true;
            boxEl.classList.add('opened');
            openedCount++;

            const resultType = gameBoxes[index];
            const details = outcomeDetails[resultType];
            
            iconEl.innerText = details.icon;
            
            // รอแอนิเมชันพลิกกล่อง 450ms ก่อนแสดง Modal
            setTimeout(() => {
                showModal(resultType, details);
            }, 450); 
        }

        function showModal(resultType, details) {
            modalIcon.innerText = details.icon;
            modalTitle.style.color = details.titleColor;
            modalActionButtons.innerHTML = '';
            
            if (resultType === 'continue') {
                modalTitle.innerText = "โชคดีมาก!";
                modalDesc.innerHTML = `คุณได้สิทธิ์ <b style="color: var(--success)">'เล่นต่อ'</b> ตาถัดไปได้เลย`;
                
                const btn = document.createElement('button');
                btn.className = 'modal-btn btn-ok';
                btn.innerText = 'ตกลง (เล่นต่อ)';
                btn.onclick = () => updateStatus(details.text);
                modalActionButtons.appendChild(btn);

            } else if (resultType.startsWith('rest')) {
                modalTitle.innerText = "หยุดก่อน!";
                modalDesc.innerHTML = `น่าเสียดาย คุณโดนสั่ง <b style="color: var(--danger)">'${details.text}'</b>`;
                
                const btn = document.createElement('button');
                btn.className = 'modal-btn btn-ok';
                btn.innerText = 'ยอมรับชะตากรรม';
                btn.onclick = () => updateStatus(details.text);
                modalActionButtons.appendChild(btn);

            } else if (resultType === 'action') {
                modalTitle.innerText = "ภารกิจพิเศษ!";
                const randomAction = actionsList[Math.floor(Math.random() * actionsList.length)];
                modalDesc.innerHTML = `ท่าที่คุณต้องทำคือ:<br><br><span style="font-size: clamp(18px, 5vw, 22px); color: var(--primary); display:block; margin-top:10px;"><b>"${randomAction}"</b></span><br>ทำสำเร็จหรือไม่?`;

                const btnYes = document.createElement('button');
                btnYes.className = 'modal-btn btn-action-yes';
                btnYes.innerText = 'ทำได้ (เล่นต่อ)';
                btnYes.onclick = () => updateStatus('ทำท่าสำเร็จ! ได้เล่นต่อ');

                const btnNo = document.createElement('button');
                btnNo.className = 'modal-btn btn-action-no';
                btnNo.innerText = 'ทำไม่ได้ (อดเล่น)';
                btnNo.onclick = () => updateStatus('ทำท่าไม่สำเร็จ! อดเล่น');

                modalActionButtons.appendChild(btnYes);
                modalActionButtons.appendChild(btnNo);
            }

            modalOverlay.classList.add('open');
        }

        function updateStatus(text) {
            closeModal();
            statusText.innerHTML = `ล่าสุด: <span class='status-highlight'>${text}</span> (เปิดแล้ว ${openedCount}/20)`;
            
            if (openedCount >= 20) {
                setTimeout(() => {
                    statusText.innerHTML = `<span style='color: var(--success); font-weight: bold;'>🎉 เปิดครบทุกกล่องแล้ว!</span>`;
                }, 400);
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
        }

        // โหลดเกมครั้งแรก
        initGame();
    </script>
</body>
</html>
